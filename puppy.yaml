apiVersion: apps/v1
kind: Deployment
metadata:
  name: puppy
  labels:
    app: puppy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: puppy
  template:
    metadata:
      labels:
        app: puppy
    spec:
      containers:
        - name: puppy
          image: wilses10/puppy:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: puppy
spec:
  type: NodePort
  selector:
    app: puppy
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 32080
